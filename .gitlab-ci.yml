# GitLab CI: test both halves on every push, build the production image,
# and deploy to Fly.io on demand from main or development.
stages:
  - test
  - build
  - deploy

backend-tests:
  stage: test
  image: golang:1.25
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: devsignal
    POSTGRES_PASSWORD: devsignal
    POSTGRES_DB: devsignal
    TEST_DATABASE_URL: postgres://devsignal:devsignal@postgres:5432/devsignal?sslmode=disable
  script:
    - cd backend
    - go vet ./...
    - go test -count=1 -cover ./...
    - go test -count=1 -tags=integration ./internal/integration/ -v

backend-lint:
  stage: test
  image: golangci/golangci-lint:latest
  script:
    - cd backend
    - golangci-lint run ./...

frontend-build:
  stage: test
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npx oxlint src
  artifacts:
    paths:
      - frontend/dist

docker-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-fly:
  stage: deploy
  image: alpine:3.21
  script:
    - apk add --no-cache curl
    - curl -L https://fly.io/install.sh | sh
    - /root/.fly/bin/flyctl deploy --remote-only
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"
      when: manual # deliberate releases only; requires FLY_API_TOKEN CI variable
